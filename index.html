<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Comedor Típico La Abuelita</title>

  <link rel="stylesheet" href="style.css?v=3">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5BJES2CC1K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-5BJES2CC1K');

    function trackLanguage(language) {
      gtag('event', 'language_selected', {
        language: language
      });
    }
  </script>

  <!-- Polices -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet"
  >
</head>


<body>

  <!-- Bordure décorative -->
  <div class="oaxaca-border"></div>


  <main class="home">

    <!-- ==============================
         LOGO
    =============================== -->

    <header class="restaurant-header">

      <img
        src="https://raw.githubusercontent.com/Duanra42/La-Abuelita-restaurante/main/Illustration_sans_titre-1%202.png"
        alt="Comedor Típico La Abuelita"
        class="restaurant-logo"
      >

      <div class="separator">
        <span>◆</span>
      </div>

      <p class="tagline">
        Auténtica cocina tradicional oaxaqueña
      </p>

    </header>


    <!-- ==============================
         CHOIX DE LA LANGUE
    =============================== -->

    <section class="language-section">

      <div class="section-title">

        <h1>BIENVENIDOS</h1>

        <p>Welcome</p>

      </div>


      <p class="choose-language">
        Seleccione su idioma
      </p>

      <p class="choose-language-en">
        Select your language
      </p>


      <div class="languages">

        <a
          href="menu_es.html"
          class="language-button"
          onclick="trackLanguage('Spanish')"
        >
          <span class="language-name">Español</span>
          <span class="language-arrow">›</span>
        </a>


        <a
          href="menu_en.html"
          class="language-button"
          onclick="trackLanguage('English')"
        >
          <span class="language-name">English</span>
          <span class="language-arrow">›</span>
        </a>


        <a
          href="menu_fr.html"
          class="language-button"
          onclick="trackLanguage('French')"
        >
          <span class="language-name">Français</span>
          <span class="language-arrow">›</span>
        </a>


        <a
          href="menu_it.html"
          class="language-button"
          onclick="trackLanguage('Italian')"
        >
          <span class="language-name">Italiano</span>
          <span class="language-arrow">›</span>
        </a>


        <a
          href="menu_de.html"
          class="language-button"
          onclick="trackLanguage('German')"
        >
          <span class="language-name">Deutsch</span>
          <span class="language-arrow">›</span>
        </a>


        <a
          href="menu_ja.html"
          class="language-button"
          onclick="trackLanguage('Japanese')"
        >
          <span class="language-name">日本語</span>
          <span class="language-arrow">›</span>
        </a>


        <a
          href="menu_ko.html"
          class="language-button"
          onclick="trackLanguage('Korean')"
        >
          <span class="language-name">한국어</span>
          <span class="language-arrow">›</span>
        </a>

      </div>

    </section>


    <!-- ==============================
         INFORMATIONS
    =============================== -->

    <footer class="restaurant-footer">

      <div class="footer-decoration">
        ✦
      </div>

      <p class="footer-name">
        COMEDOR TÍPICO LA ABUELITA
      </p>

      <p>
        Mercado 20 de Noviembre
      </p>

      <p>
        Locales 101, 102, 103
      </p>

      <p>
        Oaxaca de Juárez, México
      </p>

      <p class="instagram">
        @la_abuelita_oax
      </p>

    </footer>

  </main>


  <!-- Bordure décorative -->
  <div class="oaxaca-border bottom"></div>

</body>
</html>
